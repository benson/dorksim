<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dork simulator</title>
<meta name="description" content="dork, a black pug, in pixel art. press a bone and he walks over and does it.">
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{--bg:#15110e;--ink:#eae2d4;--dim:#9a8e7e;--line:#3d342c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.02em;color:var(--dim)}
#stage{display:flex;flex-direction:column;align-items:center}
/* phones and portrait windows: edge to edge, from the top */
body.tall main{justify-content:flex-start;padding:10px 0 0;gap:8px}
#bones{position:relative}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
/* the bones are drawn in the canvas; these real buttons sit exactly over them for pointer, keyboard and screen readers */
nav button{position:absolute;margin:0;padding:0;border:0;background:transparent;color:transparent;font-size:1px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
nav button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>dork simulator</h1>
  <div id="stage">
  <canvas id="view" aria-label="pixel art of dork, a black pug, in his room"></canvas>
  <div id="bones">
  <canvas id="ui" aria-hidden="true"></canvas>
  <nav aria-label="what dork does">
    <button data-go="bed">lay in bed</button>
    <button data-go="floor">stand on the floor</button>
    <button data-go="sitcorner">sit in the corner</button>
    <button data-go="standcorner">stand in the corner</button>
    <button data-go="sad">look sad</button>
  </nav>
  </div>
  </div>
</main>

    var availH = window.innerHeight - h1.offsetHeight - (tall ? 28 : 36), rs, us, gap = 0;
    if (!tall) {
      // desktop: room and a row of bones at one crisp scale, centred
      S.layout('wide', 0);
      rs = us = crisp(Math.min((fullW - 24) / S.W, availH / (S.H + S.uiH())), dpr);
    } else {
      // phones: the room spans the full width; the bones get the rest, up to about 52 css px each,
      // on a shelf panel exactly as wide as the screen
      gap = 10;
      rs = fullW / S.W;
      S.layout('tall', 0);
      us = Math.max(1, Math.min(52 / 17, fullW / S.uiW(), (availH - S.H * rs - gap) / S.uiH()));
      S.layout('tall', Math.floor(fullW / us));
      us = fullW / S.uiW();              // exactly edge to edge
    }
    if (!bones || bones.c.width !== S.uiW() || bones.c.height !== S.uiH()) bones = surface(S.uiW(), S.uiH());
    layout = S.buttons();
    var uw = S.uiW(), uh = S.uiH();
    stage.style.gap = gap + 'px';
    size(cv, S.W, S.H, rs, dpr);
    size(ucv, uw, uh, us, dpr);
    ctx.imageSmoothingEnabled = false; uctx.imageSmoothingEnabled = false;
    for (var i = 0; i < buttons.length; i++) {
      var b = layout[i], st = buttons[i].style;
      st.left = b.x * us + 'px'; st.top = (b.y - 1) * us + 'px';
      st.width = b.w * us + 'px'; st.height = (b.h + 2) * us + 'px';
    }
  }
  addEventListener('resize', fit);
  fit();
  buttons.forEach(function (b, i) {
    b.addEventListener('pointerenter', function () { S.hover(i); });
    b.addEventListener('pointerleave', function () { S.hover(-1); S.press(-1); });
    b.addEventListener('pointerdown', function () { S.press(i); });
    b.addEventListener('pointerup', function () { S.press(-1); });
    b.addEventListener('focus', function () { S.hover(i); });
    b.addEventListener('blur', function () { S.hover(-1); });
  });
  function mark() {
    for (var i = 0; i < buttons.length; i++) buttons[i].setAttribute('aria-pressed', buttons[i].dataset.go === S.target() ? 'true' : 'false');
  }
  nav.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    S.go(b.dataset.go);
    mark();
  });
  mark();
  function present(src, surf, canvas, c2d) {
    for (var i = 0; i < src.length; i++) surf.px[i] = LUT[src[i]];
    surf.x.putImageData(surf.img, 0, 0);
    c2d.drawImage(surf.c, 0, 0, canvas.width, canvas.height);
  }
  var STEP = 1000 / 60, acc = 0, last = performance.now();
  function frame(now) {
    acc += Math.min(250, now - last); last = now;
    while (acc >= STEP) { S.update(); acc -= STEP; }
    S.draw();
    present(S.fb, room, cv, ctx);
    present(S.uiFb(), bones, ucv, uctx);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
