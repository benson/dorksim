<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dork simulator</title>
<meta name="description" content="dork, a black pug, in pixel art. press a bone and he walks over and does it.">
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{--bg:#15110e;--ink:#eae2d4;--dim:#9a8e7e;--line:#3d342c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.02em;color:var(--dim)}
#stage{display:flex;flex-direction:column;align-items:center}
/* phones and portrait windows: edge to edge, from the top */
body.tall main{justify-content:flex-start;padding:10px 0 0;gap:8px}
#bones{position:relative}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
/* the bones are drawn in the canvas; these real buttons sit exactly over them for pointer, keyboard and screen readers */
nav button{position:absolute;margin:0;padding:0;border:0;background:transparent;color:transparent;font-size:1px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
nav button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>dork simulator</h1>
  <div id="stage">
  <canvas id="view" aria-label="pixel art of dork, a black pug, in his room"></canvas>
  <div id="bones">
  <canvas id="ui" aria-hidden="true"></canvas>
  <nav aria-label="what dork does">
    <button data-go="bed">lay in bed</button>
    <button data-go="floor">stand on the floor</button>
    <button data-go="sitcorner">sit in the corner</button>
    <button data-go="standcorner">stand in the corner</button>
    <button data-go="sad">look sad</button>
  </nav>
  </div>
  </div>
</main>
<script id="core">
'use strict';
// Every pixel on screen comes from a grid below; code only picks which grid and where.
// Dork's poses and his room were generated from photos (Codex image gen), translated at the image's
// own pixel grid, and cleaned by hand. Eye patches, the bone buttons and their font are typed.
var SCENE = (function () {
  var W = 480, H = 270;
  var CH = {
    k: '#0a0a0a', '0': '#111110', '1': '#171819', '2': '#212225', '3': '#2b2d32', '4': '#393a3e',
    '5': '#4d4d50', '6': '#605f61', '7': '#88827d', '8': '#b2a79b',
    D: '#100b08', E: '#331c12', F: '#4a2717', w: '#f9ead4',
    p: '#6b3818', q: '#7e4320', v: '#f0b066', x: '#fff0c8',
    O: '#3a2414', P: '#5a3a22', Q: '#7a5234', B: '#2a190d',
    W: '#fffaf0', S: '#f1e4c8', T: '#dcc7a1', V: '#b99b70', X: '#ffe3a0', Y: '#f5c15a', C: '#c98a2e'
/*BEDPAL*/
/*ROOMPAL*/
  };
  var PAL = [], IDX = {};
  for (var key in CH) { IDX[key] = PAL.length; PAL.push(CH[key]); }
  var NONE = 255;
  var fb = new Uint8Array(W * H);
  var T = fb, TW = W, TH = H;             // current draw target
  function into(buf, w, h) { T = buf; TW = w; TH = h; }

  function grid(rows) {
    var h = rows.length, w = rows[0].length, d = new Uint8Array(w * h);
    for (var y = 0; y < h; y++) {
      if (rows[y].length !== w) throw new Error('ragged row ' + y + ' (' + rows[y].length + ' vs ' + w + '): ' + rows[y]);
      for (var x = 0; x < w; x++) {
        var ch = rows[y][x];
        if (ch === '.') { d[y * w + x] = NONE; continue; }
        if (!(ch in IDX)) throw new Error('unmapped char ' + ch + ' in row ' + y);
        d[y * w + x] = IDX[ch];
      }
    }
    return { w: w, h: h, d: d };
  }

  // the only pixel write in the scene; flip mirrors the grid left to right
  function blit(g, ox, oy, flip) {
    for (var y = 0; y < g.h; y++) {
      var fy = oy + y;
      if (fy < 0 || fy >= TH) continue;
      for (var x = 0; x < g.w; x++) {
        var c = g.d[y * g.w + (flip ? g.w - 1 - x : x)], fx = ox + x;
        if (c === NONE || fx < 0 || fx >= TW) continue;
        T[fy * TW + fx] = c;
      }
    }
  }

  var ROOM = grid([
/*ROOM*/
  ]);

/*SPRITES*/

  // breathing: one torso row repeated (inhale, everything above rises a pixel) or dropped (sigh out)
  function frames(rows, torso) {
    return {
      rest: grid(rows),
      inhale: grid(rows.slice(0, torso).concat([rows[torso]], rows.slice(torso))),
      exhale: grid(rows.slice(0, torso).concat(rows.slice(torso + 1)))
    };
  }
  for (var name in POSES) {
    var P0 = POSES[name];
    P0.f = P0.inhaleRows ? { rest: grid(P0.rows), inhale: grid(P0.inhaleRows), exhale: grid(P0.rows) } : frames(P0.rows, P0.torso);
  }
  var WALK = [grid(WALK_ROWS[0]), grid(WALK_ROWS[1])];
  var BED = grid(BED_ROWS);
  // contact shadows are built from each sprite's own outline (build.py) and drawn under it
  for (var sname in POSES) if (POSES[sname].shadow) POSES[sname].sh = grid(POSES[sname].shadow);
  var WALK_SH = [grid(WALK_SHADOW_ROWS[0]), grid(WALK_SHADOW_ROWS[1])];

  // hand-typed eye patches
  var EYE_SHUT = grid([
    '01122110',
    '12233221',
    '12334321',
    '12344321',
    '11233211',
    'kk1221kk',
    '0kkkkkk0',
    '00111100'
  ]);
  var EYE_SHUT_S = grid([
    '0112110',
    '1223321',
    '1234432',
    '1233321',
    'kk121kk',
    '0kkkkk0',
    '0011100'
  ]);
  var EYE_AWAY = grid([
    '01122110',
    '12233221',
    '12334321',
    '11233211',
    'kkkkkkkk',
    'kEFwEEDk',
    '.kEEEDk.',
    '..kkkk..'
  ]);

  var DUST = grid(['x']), DUST_DIM = grid(['v']);
  var MOTES = [395, 100, 410, 115, 430, 104, 462, 150, 470, 190, 466, 240, 452, 258, 440, 250];

  // ---- bone buttons: typed ends and a middle column stretched to fit a typed pixel-font label ----
  var BONE_L = [
    '..BBB...',
    '.BWWSB..',
    'BWSSSSB.',
    'BSSSSSBB',
    'BSSSSSWW',
    'BSSSSSSS',
    '.BSSSSSS',
    '..BSSSSS',
    '..BSSSSS',
    '..BSSSSS',
    '.BSSSSSS',
    'BSSSSSSS',
    'BTSSSSTT',
    'BTSSSTBB',
    'BVTTTVB.',
    '.BVVVB..',
    '..BBB...'
  ];
  var BONE_M = ['.', '.', '.', 'B', 'W', 'S', 'S', 'S', 'S', 'S', 'S', 'S', 'T', 'B', '.', '.', '.'];
  var BONE_R = [
    '...BBB..',
    '..BSSSB.',
    '.BSSSSTB',
    'BBSSSSTB',
    'WWSSSSTB',
    'SSSSSSTB',
    'SSSSSTB.',
    'SSSSSB..',
    'SSSSSB..',
    'SSSSSB..',
    'SSSSSTB.',
    'SSSSSSTB',
    'TTSSSSTB',
    'BBSSSTVB',
    '.BVTTVB.',
    '..BVVVB.',
    '...BBB..'
  ];
  // the pose you picked gets a golden bone: same typed shape, swapped colors
  function gold(rows) { return rows.map(function (r) { return r.replace(/W/g, 'X').replace(/S/g, 'Y').replace(/T/g, 'Y').replace(/V/g, 'C'); }); }
  var BONE = [grid(BONE_L), grid(BONE_M), grid(BONE_R)];
  var BONE_GOLD = [grid(gold(BONE_L)), grid(gold(BONE_M)), grid(gold(BONE_R))];
  var SHELF = grid(SHELF_ROWS);

  // lowercase pixel font: 8 rows (ascender, x-height, one descender row), proportional widths
  var FONT_ROWS = {
    a: ['....', '....', '.BB.', '...B', '.BBB', 'B..B', '.BBB', '....'],
    b: ['B...', 'B...', 'BBB.', 'B..B', 'B..B', 'B..B', 'BBB.', '....'],
    c: ['...', '...', '.BB', 'B..', 'B..', 'B..', '.BB', '...'],
    d: ['...B', '...B', '.BBB', 'B..B', 'B..B', 'B..B', '.BBB', '....'],
    e: ['....', '....', '.BB.', 'B..B', 'BBBB', 'B...', '.BBB', '....'],
    f: ['..B', '.B.', 'BBB', '.B.', '.B.', '.B.', '.B.', '...'],
    h: ['B...', 'B...', 'BBB.', 'B..B', 'B..B', 'B..B', 'B..B', '....'],
    i: ['B', '.', 'B', 'B', 'B', 'B', 'B', '.'],
    k: ['B...', 'B...', 'B..B', 'B.B.', 'BB..', 'B.B.', 'B..B', '....'],
    l: ['B', 'B', 'B', 'B', 'B', 'B', 'B', '.'],
    n: ['....', '....', 'BBB.', 'B..B', 'B..B', 'B..B', 'B..B', '....'],
    o: ['....', '....', '.BB.', 'B..B', 'B..B', 'B..B', '.BB.', '....'],
    r: ['...', '...', 'B.B', 'BB.', 'B..', 'B..', 'B..', '...'],
    s: ['....', '....', '.BBB', 'B...', '.BB.', '...B', 'BBB.', '....'],
    t: ['.B.', '.B.', 'BBB', '.B.', '.B.', '.B.', '..B', '...'],
    y: ['....', '....', 'B..B', 'B..B', 'B..B', '.BBB', '...B', '.BB.']
  };
  var FONT = {};
  for (var fch in FONT_ROWS) FONT[fch] = grid(FONT_ROWS[fch]);
  var SPACE_W = 3, BONE_H = 17, ROW_H = 26;
  function textWidth(str) {
    var w = 0;
    for (var i = 0; i < str.length; i++) w += (str[i] === ' ' ? SPACE_W : FONT[str[i]].w) + (i < str.length - 1 ? 1 : 0);
    return w;
  }
  var BUTTONS = [['bed', 'lay in bed'], ['floor', 'stand on the floor'], ['sitcorner', 'sit in the corner'],
                 ['standcorner', 'stand in the corner'], ['sad', 'look sad']];
  var BX = [], BY = [], BW = [], TXW = [], GAP = 8;
  var uiMode = '', UI_W = W, UI_H = ROW_H, uifb = null;
  // wide: one row of bones on a shelf under the room. tall (phones): a stack of equal bones, one per shelf.
  function layout(mode, minW) {
    var key = mode + ':' + (minW | 0);
    if (key === uiMode) return false;
    uiMode = key;
    var i, maxW = 0, x, total = -GAP;
    for (i = 0; i < BUTTONS.length; i++) {
      TXW[i] = textWidth(BUTTONS[i][1]); BW[i] = TXW[i] + 18;
      if (BW[i] > maxW) maxW = BW[i];
      total += BW[i] + GAP;
    }
    if (mode === 'wide') {
      UI_W = W; UI_H = ROW_H;
      for (i = 0, x = (W - total) >> 1; i < BUTTONS.length; i++) { BX[i] = x; BY[i] = 4; x += BW[i] + GAP; }
    } else {
      UI_W = Math.max(maxW + 16, minW | 0); UI_H = ROW_H * BUTTONS.length;
      for (i = 0; i < BUTTONS.length; i++) { BW[i] = maxW; BX[i] = (UI_W - maxW) >> 1; BY[i] = i * ROW_H + 4; }
    }
    uifb = new Uint8Array(UI_W * UI_H);
    return true;
  }
  var ui = { hover: -1, press: -1 };

  function drawButton(i) {
    var set = BUTTONS[i][0] === dog.target ? BONE_GOLD : BONE;
    var y = BY[i] + (ui.press === i ? 1 : ui.hover === i ? -1 : 0), x = BX[i], w = BW[i];
    blit(set[0], x, y);
    for (var m = x + 8; m < x + w - 8; m++) blit(set[1], m, y);
    blit(set[2], x + w - 8, y);
    var str = BUTTONS[i][1], tx = x + ((w - TXW[i]) >> 1);
    for (var c = 0; c < str.length; c++) {
      if (str[c] === ' ') { tx += SPACE_W + 1; continue; }
      blit(FONT[str[c]], tx, y + 5);
      tx += FONT[str[c]].w + 1;
    }
  }

  function drawUI() {
    into(uifb, UI_W, UI_H);
    for (var r = 0; r * ROW_H < UI_H; r++) blit(SHELF, -((r * 157) % 240), r * ROW_H);   // each shelf a different stretch of plank
    for (var i = 0; i < BUTTONS.length; i++) drawButton(i);
  }

  // ---- dork ----
  var dog = { x: SPOTS.sad[0], y: SPOTS.sad[1], pose: 'sad', target: 'sad', walking: false, flip: false, t: 0, step: 0 };
  var SPEED = 0.8;

  function go(name) {
    if (!SPOTS[name]) return;
    dog.target = name;
    var s = SPOTS[name];
    if (Math.abs(s[0] - dog.x) < 1 && Math.abs(s[1] - dog.y) < 1) { dog.pose = name; dog.walking = false; dog.t = 0; return; }
    dog.walking = true; dog.t = 0;
  }

  function update() {
    dog.t++;
    if (dog.walking) {
      var s = SPOTS[dog.target], dx = s[0] - dog.x, dy = s[1] - dog.y, d = Math.abs(dx) + Math.abs(dy);
      if (d <= SPEED) { dog.x = s[0]; dog.y = s[1]; dog.walking = false; dog.pose = dog.target; dog.t = 0; return; }
      var len = Math.max(Math.abs(dx), Math.abs(dy));
      dog.x += dx / len * SPEED; dog.y += dy / len * SPEED;
      if (Math.abs(dx) > 2) dog.flip = dx < 0;
      if (dog.t % 9 === 0) dog.step ^= 1;
    }
  }

  // sad pose keeps its own little story: look, glance away, sigh, look back
  var SAD_BEATS = [220, 60, 84, 56], SAD_TOTAL = 420;
  function poseState() {
    var q = dog.t - dog.t % 5, lift = 0, eyes = 0, P = POSES[dog.pose];
    if (dog.pose === 'sad') {
      var c = q % SAD_TOTAL;
      if (c < 220) { lift = ((c / 48) | 0) % 2; if (c >= 140 && c < 150) eyes = 2; }
      else if (c < 280) { eyes = c - 220 < 5 ? 0 : 1; }
      else if (c < 364) { var s = c - 280; eyes = 1; lift = s < 10 ? 0 : s < 45 ? 1 : s < 50 ? 0 : s < 80 ? -1 : 0; }
      else { var b = c - 364; eyes = b < 15 ? 1 : b < 25 ? 2 : 0; }
    } else {
      lift = ((q / P.breath) | 0) % 2;
      if (P.eyes.length && q % 230 >= 200 && q % 230 < 210) eyes = 2;
    }
    return (lift + 1) * 4 + eyes;
  }

  function drawDog() {
    var P, g, ax, ay, flip = false;
    if (dog.walking) {
      g = WALK[dog.step]; ax = WALK_ANCHOR[0]; ay = WALK_ANCHOR[1]; flip = dog.flip;
      blit(WALK_SH[dog.step], Math.round(dog.x) - (flip ? g.w - ax : ax), Math.round(dog.y) - ay, flip);
      blit(g, Math.round(dog.x) - (flip ? g.w - ax : ax), Math.round(dog.y) - ay, flip);
      return;
    }
    P = POSES[dog.pose];
    var st = poseState(), lift = (st >> 2) - 1, eyes = st & 3;
    g = lift > 0 ? P.f.inhale : lift < 0 ? P.f.exhale : P.f.rest;
    var px = P.at ? P.at[0] : Math.round(dog.x), py = P.at ? P.at[1] : Math.round(dog.y);
    var left = px - P.anchor[0], top = py - P.anchor[1] - lift;
    if (P.sh) blit(P.sh, px - P.anchor[0], py - P.anchor[1]);
    blit(g, left, top);
    if (eyes) {
      var patch = eyes === 2 ? (P.small ? EYE_SHUT_S : EYE_SHUT) : EYE_AWAY;
      for (var e = 0; e < P.eyes.length; e += 2) blit(patch, left + P.eyes[e], top + P.eyes[e + 1]);
    }
  }

  function draw() {
    drawRoom();
    drawUI();
  }

  function drawRoom() {
    into(fb, W, H);
    blit(ROOM, 0, 0);
    var q = (SCENE_TICK / 5) | 0;
    for (var i = 0; i < MOTES.length; i += 2) {
      var ph = (q + i * 5) % 24;
      if (ph < 3) blit(DUST, MOTES[i], MOTES[i + 1]);
      else if (ph < 6) blit(DUST_DIM, MOTES[i], MOTES[i + 1]);
    }
    // in bed he is part of the bed picture: the occupied bed replaces the empty one
    if (!dog.walking && dog.pose === 'bed') {
      var B = POSES.bed, lift = (poseState() >> 2) - 1;
      blit(lift > 0 ? B.f.inhale : B.f.rest, BED_POS[0] + B.at[0], BED_POS[1] + B.at[1]);
      return;
    }
    var behindBed = dog.y < BED_POS[1] + BED.h - 12;
    if (behindBed) drawDog();
    blit(BED, BED_POS[0], BED_POS[1]);
    if (!behindBed) drawDog();
  }

  var SCENE_TICK = 0;
  layout('wide', 0);
  return {
    W: W, H: H, PAL: PAL, fb: fb,
    update: function () { SCENE_TICK++; update(); },
    draw: draw,
    go: go,
    target: function () { return dog.target; },
    state: function () { return (dog.walking ? 'walk>' : '') + dog.target + ' ' + dog.t; },
    layout: layout,
    uiW: function () { return UI_W; },
    uiH: function () { return UI_H; },
    uiFb: function () { return uifb; },
    buttons: function () { return BUTTONS.map(function (b, i) { return { go: b[0], x: BX[i], y: BY[i], w: BW[i], h: BONE_H }; }); },
    hover: function (i) { ui.hover = i; },
    press: function (i) { ui.press = i; }
  };
})();
</script>
<script>
(function () {
  var S = SCENE, stage = document.getElementById('stage'), h1 = document.querySelector('h1');
  var cv = document.getElementById('view'), ctx = cv.getContext('2d');
  var ucv = document.getElementById('ui'), uctx = ucv.getContext('2d');
  var nav = document.querySelector('nav'), buttons = nav.querySelectorAll('button'), layout = null;
  var LUT = new Uint32Array(S.PAL.length);
  for (var i = 0; i < S.PAL.length; i++) {
    var n = parseInt(S.PAL[i].slice(1), 16);
    LUT[i] = 0xff000000 | ((n & 0xff) << 16) | (n & 0xff00) | (n >> 16);
  }
  function surface(w, h) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var x = c.getContext('2d'), img = x.createImageData(w, h);
    return { c: c, x: x, img: img, px: new Uint32Array(img.data.buffer) };
  }
  var room = surface(S.W, S.H), bones = null;

  // css px per art pixel: whole device pixels where that fills the space; on high-density phones
  // fill the width instead (uneven pixels are too small to see there)
  function crisp(css, dpr) {
    var whole = Math.max(1, Math.floor(css * dpr)) / dpr;
    return dpr < 2 || whole >= css * 0.9 ? whole : css;
  }
  function size(c, w, h, s, dpr) {
    var k = Math.max(1, Math.ceil(s * dpr - 1e-6));
    c.width = w * k; c.height = h * k;
    c.style.width = w * s + 'px'; c.style.height = h * s + 'px';
  }
  function fit() {
    var dpr = window.devicePixelRatio || 1;
    var fullW = document.documentElement.clientWidth;
    var tall = fullW < 664 || window.innerHeight - 60 > (fullW - 24) * 0.8;
    document.body.classList.toggle('tall', tall);
    var availH = window.innerHeight - h1.offsetHeight - (tall ? 28 : 36), rs, us, gap = 0;
    if (!tall) {
      // desktop: room and a row of bones at one crisp scale, centred
      S.layout('wide', 0);
      rs = us = crisp(Math.min((fullW - 24) / S.W, availH / (S.H + S.uiH())), dpr);
    } else {
      // phones: the room spans the full width; the bones get the rest, up to about 52 css px each,
      // on a shelf panel exactly as wide as the screen
      gap = 10;
      rs = fullW / S.W;
      S.layout('tall', 0);
      us = Math.max(1, Math.min(52 / 17, fullW / S.uiW(), (availH - S.H * rs - gap) / S.uiH()));
      S.layout('tall', Math.floor(fullW / us));
      us = fullW / S.uiW();              // exactly edge to edge
    }
    if (!bones || bones.c.width !== S.uiW() || bones.c.height !== S.uiH()) bones = surface(S.uiW(), S.uiH());
    layout = S.buttons();
    var uw = S.uiW(), uh = S.uiH();
    stage.style.gap = gap + 'px';
    size(cv, S.W, S.H, rs, dpr);
    size(ucv, uw, uh, us, dpr);
    ctx.imageSmoothingEnabled = false; uctx.imageSmoothingEnabled = false;
    for (var i = 0; i < buttons.length; i++) {
      var b = layout[i], st = buttons[i].style;
      st.left = b.x * us + 'px'; st.top = (b.y - 1) * us + 'px';
      st.width = b.w * us + 'px'; st.height = (b.h + 2) * us + 'px';
    }
  }
  addEventListener('resize', fit);
  fit();
  buttons.forEach(function (b, i) {
    b.addEventListener('pointerenter', function () { S.hover(i); });
    b.addEventListener('pointerleave', function () { S.hover(-1); S.press(-1); });
    b.addEventListener('pointerdown', function () { S.press(i); });
    b.addEventListener('pointerup', function () { S.press(-1); });
    b.addEventListener('focus', function () { S.hover(i); });
    b.addEventListener('blur', function () { S.hover(-1); });
  });
  function mark() {
    for (var i = 0; i < buttons.length; i++) buttons[i].setAttribute('aria-pressed', buttons[i].dataset.go === S.target() ? 'true' : 'false');
  }
  nav.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    S.go(b.dataset.go);
    mark();
  });
  mark();
  function present(src, surf, canvas, c2d) {
    for (var i = 0; i < src.length; i++) surf.px[i] = LUT[src[i]];
    surf.x.putImageData(surf.img, 0, 0);
    c2d.drawImage(surf.c, 0, 0, canvas.width, canvas.height);
  }
  var STEP = 1000 / 60, acc = 0, last = performance.now();
  function frame(now) {
    acc += Math.min(250, now - last); last = now;
    while (acc >= STEP) { S.update(); acc -= STEP; }
    S.draw();
    present(S.fb, room, cv, ctx);
